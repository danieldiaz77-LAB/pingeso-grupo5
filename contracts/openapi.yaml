openapi: 3.1.0

info:
  title: API de Ranking y Rentabilidad — Grupo 5
  version: 0.1.0
  summary: Borrador preliminar para revisión del equipo
  description: |
    Contrato propuesto para las consultas de ranking de productos, margen por
    producto y rentabilidad total.

    **Estado: BORRADOR, NO APROBADO.** Los nombres de rutas y campos, las reglas
    aún no acordadas son propuestas sujetas a revisión.
    Las respuestas de ejemplo contienen datos ficticios para construir mocks.

    Este YAML es una referencia de diseño. Según el flujo previsto para el
    proyecto, la versión publicada debe generarse desde las operaciones y
    los tipos definidos en Go/Huma, y los tipos del frontend deben derivarse
    del contrato generado.

    **Dependencias sin contrato recibido:** Productos (Grupo 3) y Ventas
    (Grupo 9). No se presupone ningún endpoint, identificador ni payload
    específico de esos equipos.
  x-estado: borrador-para-revision
  x-pendientes-generales:
    - Acordar con Ventas qué estados cuentan y cómo tratar anulaciones y devoluciones.
    - Acordar si los importes incluyen IVA y cómo aplicar descuentos.
    - Acordar fuente y definición del costo histórico de cada unidad vendida.
    - Resolver si rentabilidad total equivale a suma de márgenes u otra métrica, como flujo de caja.
    - Confirmar con el Grupo 6 el nombre de la cookie de sesión y acordar los permisos de cada consulta.
    - Ajustar los modelos a los contratos reales de Productos (G3) y Ventas (G9).
    - Confirmar nombres de campos y rutas con el grupo.
    - Comprobar que los códigos y cuerpos de error generados por Go/Huma coincidan con el contrato.

servers:
  - url: http://localhost:8080
    description: Desarrollo local (provisional)

tags:
  - name: Ranking
    description: Productos ordenados por unidades vendidas
  - name: Rentabilidad
    description: Consultas preliminares de ingresos, costos y márgenes

security:
  - sesionJWT: []

paths:
  /api/v1/rankings/productos:
    get:
      tags: [Ranking]
      operationId: obtenerRankingProductos
      summary: Consultar ranking de productos por unidades vendidas
      description: |
        Devuelve productos ordenados por cantidad de unidades vendidas de mayor
        a menor durante el intervalo solicitado.

        **Confirmado:** el criterio principal es la cantidad de unidades.
        **Propuesto:** ante un empate, se ordena por `producto_id` ascendente,
        para mantener un resultado estable. Las posiciones comienzan en 1.

        El formato e interpretación de fechas está definido provisionalmente
        en los parámetros compartidos. El tratamiento de devoluciones,
        anulaciones e IVA sigue pendiente de acuerdo.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Ranking obtenido; si no hay ventas, devuelve una lista vacía.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankingProducto'
              examples:
                conDatos:
                  summary: Resultado ficticio para mock
                  value:
                    - posicion: 1
                      producto_id: 11111111-1111-4111-8111-111111111111
                      nombre: Café americano
                      unidades_vendidas: 84
                    - posicion: 2
                      producto_id: 22222222-2222-4222-8222-222222222222
                      nombre: Té verde
                      unidades_vendidas: 52
                sinDatos:
                  summary: Sin ventas en el período
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/rentabilidad/productos:
    get:
      tags: [Rentabilidad]
      operationId: obtenerMargenesPorProducto
      summary: Consultar ingresos, costos y margen por producto
      description: |
        Devuelve los totales agrupados por producto para el período solicitado.
        Las cantidades monetarias se expresan como enteros de 64 bits
        en pesos chilenos (CLP), sin decimales.

        **Propuesta de fórmula:** `margen_clp = ingresos_clp - costos_clp`.
        La forma de determinar ingresos netos y costos históricos todavía
        debe acordarse. Cuando se desconoce un costo, se informa `null` en
        `costos_clp` y `margen_clp`; nunca se interpreta como costo cero.

        Cuando `incluir_porcentaje=false`, se omite `margen_porcentaje`.
        Cuando es `true`, se incluye el campo. Su fórmula provisional es
        `(margen_clp / ingresos_clp) * 100`, con dos decimales; si los
        ingresos son 0 o el margen es desconocido, su valor es `null`.

        **Pendiente:** definir cómo se integran datos de Productos (Grupo 3)
        y Ventas (Grupo 9), y qué ventas cuentan para el cálculo.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/IncluirPorcentaje'
      responses:
        '200':
          description: Margen por producto; lista vacía si no existen ventas aplicables.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MargenProducto'
              examples:
                conPorcentaje:
                  summary: Con incluir_porcentaje=true y costo conocido (datos ficticios)
                  value:
                    - producto_id: 11111111-1111-4111-8111-111111111111
                      nombre: Café americano
                      ingresos_clp: 210000
                      costos_clp: 126000
                      margen_clp: 84000
                      margen_porcentaje: 40.0
                costoPendiente:
                  summary: Con incluir_porcentaje=false y costo no disponible
                  value:
                    - producto_id: 22222222-2222-4222-8222-222222222222
                      nombre: Té verde
                      ingresos_clp: 130000
                      costos_clp: null
                      margen_clp: null
                sinDatos:
                  summary: Sin ventas en el período
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/rentabilidad/total:
    get:
      tags: [Rentabilidad]
      operationId: obtenerRentabilidadTotal
      summary: Consultar resumen económico total (definición pendiente)
      description: |
        **ENDPOINT PROVISIONAL: requiere aprobación de la definición de negocio.**

        Se propone devolver ingresos totales, costos totales y un resultado
        total calculado como ingresos menos costos. **No se afirma que esto
        sea la definición definitiva de «rentabilidad total».** Antes de
        aprobar el contrato, se debe decidir si la necesidad es una suma de
        márgenes, una medida distinta de rentabilidad o flujo de caja
        (cobros menos pagos), que no son conceptos equivalentes.

        Si faltan costos necesarios para calcular el total, `costos_totales_clp`
        y `resultado_total_clp` serán `null`, no cero. El cálculo real y las
        reglas para operaciones anuladas, devoluciones, impuestos y descuentos
        están pendientes.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Resumen provisional del período; valores ficticios para mock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentabilidadTotal'
              examples:
                costoConocido:
                  summary: Resumen ficticio si hay costos completos
                  value:
                    ingresos_totales_clp: 340000
                    costos_totales_clp: 196000
                    resultado_total_clp: 144000
                costoPendiente:
                  summary: Resultado no calculable por costos desconocidos
                  value:
                    ingresos_totales_clp: 340000
                    costos_totales_clp: null
                    resultado_total_clp: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /healthz:
    get:
      operationId: verificarEstado
      summary: Verificar si el proceso está activo
      security: []
      responses:
        '200':
          description: El proceso está activo. No comprueba dependencias.
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado:
                    const: vivo
              example:
                estado: vivo

  /readyz:
    get:
      operationId: verificarDisponibilidad
      summary: Verificar si el servicio está listo
      security: []
      responses:
        '200':
          description: PostgreSQL responde y el servicio está listo.
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado:
                    const: listo
              example:
                estado: listo
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    sesionJWT:
      type: apiKey
      in: cookie
      name: sesion
      description: |
        JWT firmado en una cookie HttpOnly, Secure y SameSite=Lax.
        El nombre `sesion` es provisional y se debe confirmar con el Grupo 6.
        Los permisos de cada consulta quedan pendientes.

  parameters:
    Desde:
      name: desde
      in: query
      required: true
      description: |
        Fecha inicial inclusiva, formato YYYY-MM-DD.
        Se interpreta en zona horaria America/Santiago (propuesta).
      schema:
        type: string
        format: date
      example: '2026-11-01'
    Hasta:
      name: hasta
      in: query
      required: true
      description: |
        Fecha final inclusiva, formato YYYY-MM-DD (propuesta).
        Debe ser igual o posterior a `desde`; de lo contrario, error 400.
        Se incluyen registros hasta el final de ese día en America/Santiago.
      schema:
        type: string
        format: date
      example: '2026-11-10'
    Limite:
      name: limite
      in: query
      required: false
      description: |
        Máximo de productos en el ranking. Propuesta: por defecto 10,
        permitido entre 1 y 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10
    IncluirPorcentaje:
      name: incluir_porcentaje
      in: query
      required: false
      description: |
        Si es `true`, cada elemento incluye `margen_porcentaje` (puede ser
        `null`). Si es `false`, se omite el campo.
      schema:
        type: boolean
        default: false
      example: true

  schemas:
    RankingProducto:
      type: object
      additionalProperties: false
      required: [posicion, producto_id, nombre, unidades_vendidas]
      properties:
        posicion:
          type: integer
          minimum: 1
          description: Posición en el ranking, comenzando en 1.
        producto_id:
          type: string
          format: uuid
          description: Identificador público del producto. Su correspondencia con Productos debe acordarse con el Grupo 3.
          example: 11111111-1111-4111-8111-111111111111
        nombre:
          type: string
          description: Nombre visible del producto; fuente a confirmar con Grupo 3.
          example: Café americano
        unidades_vendidas:
          type: integer
          minimum: 0
          description: Suma de unidades vendidas computables en el período.
          example: 84

    MargenProducto:
      type: object
      additionalProperties: false
      required: [producto_id, nombre, ingresos_clp, costos_clp, margen_clp]
      properties:
        producto_id:
          type: string
          format: uuid
          description: Identificador público del producto.
          example: 11111111-1111-4111-8111-111111111111
        nombre:
          type: string
          description: Nombre del producto.
          example: Café americano
        ingresos_clp:
          type: integer
          format: int64
          description: Ingresos agregados en CLP; criterio bruto/neto pendiente.
          example: 210000
        costos_clp:
          type: [integer, 'null']
          format: int64
          description: |
            Costos asociados a las ventas en CLP. `null` si faltan costos
            históricos necesarios; nunca reemplazar por cero.
          example: 126000
        margen_clp:
          type: [integer, 'null']
          format: int64
          description: |
            Propuesta: ingresos menos costos, o `null` si el costo es desconocido.
          example: 84000
        margen_porcentaje:
          type: [number, 'null']
          description: |
            Solo aparece cuando incluir_porcentaje=true.
            Propuesta: margen/ingresos*100 con dos decimales;
            `null` si los ingresos son cero o el margen no es calculable.
          example: 40.0

    RentabilidadTotal:
      type: object
      additionalProperties: false
      required: [ingresos_totales_clp, costos_totales_clp, resultado_total_clp]
      properties:
        ingresos_totales_clp:
          type: integer
          format: int64
          description: Total de ingresos del período en CLP (reglas pendientes).
          example: 340000
        costos_totales_clp:
          type: [integer, 'null']
          format: int64
          description: |
            Suma de costos en CLP si todos los costos necesarios se conocen;
            de lo contrario `null`.
          example: 196000
        resultado_total_clp:
          type: [integer, 'null']
          format: int64
          description: |
            Propuesta NO aprobada: ingresos_totales_clp menos
            costos_totales_clp. Se revisará según definición de rentabilidad.
          example: 144000

    Problema:
      type: object
      description: Detalle de error HTTP según RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: 'about:blank'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

  responses:
    BadRequest:
      description: Parámetros inválidos, fecha incorrecta o rango invertido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: 'about:blank'
            title: Bad Request
            status: 400
            detail: El parámetro hasta debe ser igual o posterior a desde.
    Unauthorized:
      description: La cookie de sesión no se envió o su JWT no es válido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: 'about:blank'
            title: Unauthorized
            status: 401
            detail: No autenticado.
    Forbidden:
      description: El usuario no tiene permiso para consultar el recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: 'about:blank'
            title: Forbidden
            status: 403
            detail: Acceso denegado.
    InternalServerError:
      description: Error inesperado en el microservicio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: 'about:blank'
            title: Internal Server Error
            status: 500
            detail: Error interno del servidor.
    ServiceUnavailable:
      description: Una dependencia necesaria, como PostgreSQL para la comprobación de disponibilidad, no está disponible temporalmente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: 'about:blank'
            title: Service Unavailable
            status: 503
            detail: Dependencia no disponible.
