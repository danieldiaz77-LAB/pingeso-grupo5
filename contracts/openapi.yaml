components:
  schemas:
    CrearEjemploEntradaBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/CrearEjemploEntradaBody.json
          format: uri
          readOnly: true
          type: string
        descripcion:
          description: Descripción del ejemplo
          maxLength: 500
          type: string
        nombre:
          description: Nombre del ejemplo
          maxLength: 120
          minLength: 1
          type: string
      required:
        - nombre
      type: object
    Ejemplo:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/Ejemplo.json
          format: uri
          readOnly: true
          type: string
        creadoEn:
          description: Fecha de creación
          format: date-time
          type: string
        descripcion:
          description: Descripción del ejemplo
          maxLength: 500
          type: string
        id:
          description: Identificador único del ejemplo
          format: uuid
          type: string
        nombre:
          description: Nombre del ejemplo
          maxLength: 120
          minLength: 1
          type: string
      required:
        - id
        - nombre
        - descripcion
        - creadoEn
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ListarEjemplosSalidaBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ListarEjemplosSalidaBody.json
          format: uri
          readOnly: true
          type: string
        ejemplos:
          description: Listado de ejemplos
          items:
            $ref: "#/components/schemas/Ejemplo"
          type: array
      required:
        - ejemplos
      type: object
    SaludBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/SaludBody.json
          format: uri
          readOnly: true
          type: string
        estado:
          enum:
            - ok
          examples:
            - ok
          type: string
      required:
        - estado
      type: object
info:
  title: Base técnica PINGESO
  version: 0.0.0
openapi: 3.1.0
paths:
  /api/v1/ejemplos:
    get:
      operationId: listarEjemplos
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListarEjemplosSalidaBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Lista los ejemplos disponibles
      tags:
        - Ejemplos
    post:
      operationId: crearEjemplo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearEjemploEntradaBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ejemplo"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Crea un ejemplo
      tags:
        - Ejemplos
  /healthz:
    get:
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaludBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get healthz
  /readyz:
    get:
      operationId: get-readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaludBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get readyz
